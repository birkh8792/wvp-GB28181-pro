name: release-ubuntu


on:
  push:
    branches:
      - master
      - master-abl-274
    tags:
      - "v*.*.*" # 触发条件是推送标签 如git tag v2.7.4 git push origin v2.7.4

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
        # separated: JAR + 独立 static 目录
        # integrated: 前端写入 static 后打进 JAR（前后端不分离）
        package: [separated, integrated]
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # github action运行环境

      - name: Create release # 创建文件夹
        run: |
          rm -rf release 
          mkdir release
          echo ${{ github.sha }} > Release.txt
          cp Release.txt LICENSE release/
          cat Release.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Eclipse基金会维护的开源Java发行版 因为github action参考java的用这个 所以用这个
          # 还有microsoft(微软维护的openjdk发行版) oracle(商用SDK)等
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Node.js版本 20系列的最新稳定版

      - name: clean maven cache
        run: rm -rf ~/.m2/repository/io/github/git-commit-id

      # --- integrated: 先前端写入 static，再打 JAR ---
      - name: Compile frontend (integrated)
        if: matrix.package == 'integrated'
        run: |
          cd ./web
          npm install
          npm run build:prod
          cd ../

      - name: Build Backend (integrated)
        if: matrix.package == 'integrated'
        run: mvn clean package

      # --- separated: 先打 JAR，再编前端，static 与 JAR 分开打包 ---
      - name: Build Backend (separated)
        if: matrix.package == 'separated'
        run: |
          rm -rf ./src/main/resources/static
          mvn clean package

      - name: Compile frontend (separated)
        if: matrix.package == 'separated'
        run: |
          cd ./web
          npm install
          npm run build:prod
          cd ../

      - name: Package Files
        run: |
          cp ./target/*.jar release/
          cp ./src/main/resources/application-dev.yml release/application.yml

          if [[ "${{ matrix.package }}" == "separated" ]]; then
            cp -r ./src/main/resources/static release/
          fi

          # tag 推送时 base_ref 常为空；分支推送时用 github.ref
          BRANCH="${{ github.event.base_ref }}"
          if [[ -z "$BRANCH" ]]; then
            BRANCH="${{ github.ref }}"
          fi
          BRANCH_NAME="${BRANCH#refs/heads/}"
          # 仍不是分支名（例如 refs/tags/...）时，回退到默认分支
          if [[ "$BRANCH_NAME" == refs/* || -z "$BRANCH_NAME" ]]; then
            BRANCH_NAME="${{ github.event.repository.default_branch }}"
          fi
          echo "BRANCH_NAME=${BRANCH_NAME}"

          # tag 推送用 tag 名；分支推送用短 commit，避免 refs/heads/ 带斜杠导致 zip 建文件失败
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION_NAME="${GITHUB_SHA:0:7}"
          fi
          PACKAGE_MODE="${{ matrix.package }}"
          ZIP_FILE_NAME="${BRANCH_NAME}-${VERSION_NAME}-${PACKAGE_MODE}.zip"
          zip -r "$ZIP_FILE_NAME" release
          echo "ZIP_FILE_NAME=$ZIP_FILE_NAME" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${BRANCH_NAME}-${VERSION_NAME}-${PACKAGE_MODE}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_FILE_NAME }}
