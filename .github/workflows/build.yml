name: release-ubuntu

# 编译流程参考: https://doc.wvp-pro.cn/#/_content/introduction/compile
# 5.2 编译前端 → 5.3 mvn package (jar) / 5.4 mvn package -P war

on:
  push:
    branches:
      - master
      - master-abl-274
    tags:
      - "v*.*.*" # 触发条件是推送标签 如git tag v2.7.4 git push origin v2.7.4

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
        # integrated: 官方推荐，前端进 static 后打进 jar（前后端不分离）
        # separated: jar 与 static 分开放置（前后端分离部署）
        # war: 官方 5.4，mvn package -P war
        package: [integrated, separated, war]
      max-parallel: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        run: |
          rm -rf release
          mkdir release
          echo ${{ github.sha }} > Release.txt
          cp Release.txt LICENSE release/
          cat Release.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: clean maven cache
        run: rm -rf ~/.m2/repository/io/github/git-commit-id

      # 文档 5.2：编译前端（输出到 src/main/resources/static）
      - name: Compile frontend
        if: matrix.package != 'separated'
        run: |
          cd ./web
          npm --registry=https://registry.npmmirror.com install
          npm run build:prod
          test -d ../src/main/resources/static
          cd ../

      # 文档 5.3：生成可执行 jar（前端已在 static 内）
      - name: Build Backend (integrated)
        if: matrix.package == 'integrated'
        run: mvn -B clean package -DskipTests

      # 文档 5.4：生成 war
      - name: Build Backend (war)
        if: matrix.package == 'war'
        run: mvn -B clean package -P war -DskipTests

      # 前后端分离：先打不含前端的 jar，再编前端，static 单独打包
      - name: Build Backend (separated)
        if: matrix.package == 'separated'
        run: |
          rm -rf ./src/main/resources/static
          mvn -B clean package -DskipTests

      - name: Compile frontend (separated)
        if: matrix.package == 'separated'
        run: |
          cd ./web
          npm --registry=https://registry.npmmirror.com install
          npm run build:prod
          test -d ../src/main/resources/static
          cd ../

      - name: Package Files
        run: |
          set -euo pipefail

          # 优先使用 maven 复制到 target 的配置与脚本（与本地 target 运行方式一致）
          if [[ -f ./target/application-dev.yml ]]; then
            cp ./target/application-dev.yml release/application.yml
          else
            cp ./src/main/resources/application-dev.yml release/application.yml
          fi
          if [[ -f ./target/install.sh ]]; then
            cp ./target/install.sh release/
          elif [[ -f ./src/main/resources/install.sh ]]; then
            cp ./src/main/resources/install.sh release/
          fi

          case "${{ matrix.package }}" in
            integrated)
              cp ./target/wvp-pro-*.jar release/ 2>/dev/null || cp ./target/*.jar release/
              ;;
            war)
              cp ./target/wvp-pro-*.war release/ 2>/dev/null || cp ./target/*.war release/
              ;;
            separated)
              cp ./target/wvp-pro-*.jar release/ 2>/dev/null || cp ./target/*.jar release/
              cp -r ./src/main/resources/static release/
              ;;
          esac

          # 去掉可能误拷的 sources/javadoc
          rm -f release/*-sources.jar release/*-javadoc.jar

          BRANCH="${{ github.event.base_ref }}"
          if [[ -z "$BRANCH" ]]; then
            BRANCH="${{ github.ref }}"
          fi
          BRANCH_NAME="${BRANCH#refs/heads/}"
          if [[ "$BRANCH_NAME" == refs/* || -z "$BRANCH_NAME" ]]; then
            BRANCH_NAME="${{ github.event.repository.default_branch }}"
          fi
          echo "BRANCH_NAME=${BRANCH_NAME}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION_NAME="${GITHUB_SHA:0:7}"
          fi
          PACKAGE_MODE="${{ matrix.package }}"
          ZIP_FILE_NAME="${BRANCH_NAME}-${VERSION_NAME}-${PACKAGE_MODE}.zip"
          zip -r "$ZIP_FILE_NAME" release
          echo "ZIP_FILE_NAME=$ZIP_FILE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${BRANCH_NAME}-${VERSION_NAME}-${PACKAGE_MODE}" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE_NAME }}
          if-no-files-found: error
          retention-days: 30

  # tag 推送时汇总三种产物发布到 GitHub Releases，避免 matrix 并发写 Release 冲突
  release:
    needs: build-ubuntu
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
